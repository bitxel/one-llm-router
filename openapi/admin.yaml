    # ---- Operation response body unions ----
    #
    # Every /api/admin/* operation whose 200 response body is a discriminated
    # union (`oneOf`) pins that union under its own named component schema
    # here, NOT inline on the operation. Rationale:
    #
    #   - oapi-codegen v2's strict-server generator emits inline oneOf
    #     responses as opaque wrappers with an **unexported** `union
    #     json.RawMessage` field and no public constructor — meaning the
    #     handler package (`internal/api/adminapi`) literally cannot
    #     return a success body and the generated interface becomes
    #     unsatisfiable from outside the generated package.
    #   - Ref'd named schemas, by contrast, generate as `type X union` with
    #     exported `As<Branch>() / From<Branch>() / Merge<Branch>()`
    #     helpers, making the strict-server contract usable from the
    #     real handler code.
    #
    # Wire shape is unchanged — the spec still declares the same set of
    # oneOf branches; only the Go type shape is affected. Named schemas
    # also keep the OpenAPI document DRY when the same union is reused
    # (none are reused in 003, but the layout leaves room for 004+ reuse
    # without a schema restructure).
    SettingsGetResponseBody:
      oneOf:
        - $ref: '#/components/schemas/SettingsEnvelope'
        - $ref: '#/components/schemas/SetupRequiredEnvelope'

    SettingsUpdateResponseBody:
      oneOf:
        - $ref: '#/components/schemas/SettingsEnvelope'
        - $ref: '#/components/schemas/RequestBodyTooLargeEnvelope'
        - $ref: '#/components/schemas/MalformedBodyEnvelope'
        - $ref: '#/components/schemas/UnknownConfigKeyEnvelope'
        - $ref: '#/components/schemas/EnvOverrideReadonlyEnvelope'
        - $ref: '#/components/schemas/InvalidRetentionEnvelope'
        - $ref: '#/components/schemas/InvalidLogLevelEnvelope'
        - $ref: '#/components/schemas/InvalidModelRenameEnvelope'
        - $ref: '#/components/schemas/InvalidPluginFlagEnvelope'

    OAuthCancelResponseBody:
      oneOf:
        - $ref: '#/components/schemas/CancelSuccessEnvelope'
        - $ref: '#/components/schemas/FlowIDMismatchEnvelope'

    BrowserStartResponseBody:
      oneOf:
        - $ref: '#/components/schemas/BrowserStartEnvelope'
        - $ref: '#/components/schemas/FlowInProgressEnvelope'
        - $ref: '#/components/schemas/InvalidOAuthProviderEnvelope'

    ManualCallbackResponseBody:
      oneOf:
        - $ref: '#/components/schemas/ManualCallbackSuccessEnvelope'
        - $ref: '#/components/schemas/ManualCallbackCancelEnvelope'
        - $ref: '#/components/schemas/InvalidCallbackURLEnvelope'
        - $ref: '#/components/schemas/OAuthStateMismatchEnvelope'
        - $ref: '#/components/schemas/NoFlowInProgressEnvelope'
        - $ref: '#/components/schemas/AlreadyConsumedEnvelope'
        - $ref: '#/components/schemas/FlowExpiredEnvelope'
        - $ref: '#/components/schemas/OAuthInvalidGrantEnvelope'
        - $ref: '#/components/schemas/OAuthUpstreamErrorEnvelope'

    DeviceStartResponseBody:
      oneOf:
        - $ref: '#/components/schemas/DeviceStartEnvelope'
        - $ref: '#/components/schemas/FlowInProgressEnvelope'
        - $ref: '#/components/schemas/InvalidOAuthProviderEnvelope'
        - $ref: '#/components/schemas/DeviceAuthUnavailableEnvelope'
        - $ref: '#/components/schemas/OAuthUpstreamErrorEnvelope'

    ImportAuthJSONResponseBody:
      oneOf:
        - $ref: '#/components/schemas/ImportAuthJSONSuccessEnvelope'
        - $ref: '#/components/schemas/InvalidAuthJSONStructureEnvelope'
        - $ref: '#/components/schemas/InvalidAuthJSONEnvelope'
        - $ref: '#/components/schemas/RequestBodyTooLargeEnvelope'

    ExportAuthJSONResponseBody:
      description: |
        Dual-shape response for `accountsExportAuthJSON` — the success
        branch is a raw Codex CLI `auth.json` body (the actual file the
        operator downloads), the error branches are standard envelopes.
        `CodexAuthJSON` does NOT wrap in `{code,msg,data}` because the
        whole point of the endpoint is to emit a byte-compatible
        `auth.json`; see the operation description for the precise
        Content-Disposition contract.
      oneOf:
        - $ref: '#/components/schemas/CodexAuthJSON'
        - $ref: '#/components/schemas/AccountNotFoundEnvelope'
        - $ref: '#/components/schemas/NotOAuthAccountEnvelope'

    PlaygroundRunResponseBody:
