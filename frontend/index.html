<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>one-llm-router</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="h-full bg-surface-base text-fg-base antialiased">
    <noscript>
      <style>
        body { font-family: sans-serif; padding: 2rem; }
      </style>
      <p>
        one-llm-router requires a modern browser with JavaScript enabled.
        For CLI access, use the <code>router</code> binary directly and
        see <code>docs/</code>.
      </p>
    </noscript>
    <script>
      // Pre-bundle language hint: mirrors src/i18n/detect.ts (stored
      // choice first, then a zh-prefix browser match) so <html lang> is
      // correct from the first paint, before the JS bundle executes.
      ;(function () {
        try {
          var stored = localStorage.getItem('one-llm-router.lang')
          var langs = navigator.languages || [navigator.language || 'en']
          var prefersChinese = langs.some(function (tag) {
            return (tag || '').toLowerCase().indexOf('zh') === 0
          })
          document.documentElement.lang =
            stored === 'zh-CN' || (!stored && prefersChinese) ? 'zh-CN' : 'en'
        } catch (e) {
          /* storage/navigator unavailable — keep the static lang="en" */
        }
      })()
    </script>
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
